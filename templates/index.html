<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="refresh" content="300">
    <title>EHS 数字化看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f8f9fa; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100%; height: 100%;
            background: white; padding: 2% 4%;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-end; }
        .title { font-size: 3.8vw; font-weight: 900; color: #2c3e50; }
        #live-clock { font-size: 1.8vw; font-weight: bold; color: #666; font-family: monospace; }
        .days-box { background: #00b050; color: white; padding: 8px 40px; font-size: 5.5vw; font-weight: 900; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,176,80,0.3); line-height: 1.1; }
        .header-sub { margin-top: 10px; display: flex; align-items: center; justify-content: flex-end; }
        .days-label { font-size: 1.8vw; font-weight: bold; color: #888; margin-right: 20px; }

        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; }

        /* 十字尺寸按「高度」推导：任何宽高比的大屏都能完整放下 31 格 */
        .cross-grid { display: grid; grid-template-columns: repeat(7, calc((68vh - 60px) / 7)); grid-template-rows: repeat(7, calc((68vh - 60px) / 7)); grid-gap: 10px; gap: 10px; }
        .day-cell { border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 2vw; font-weight: bold; }

        .green { background-color: #00b050; color: white; border-color: #008d40; }
        .yellow { background-color: #ffc000; color: black; border-color: #d9a300; }
        .red { background-color: #ff0000; color: white; border-color: #cc0000; }
        .future { background-color: #fff; color: #eee; border: 1px dashed #eee; }

        .today-active {
            background-color: #fff; border: 0.7vw solid #007bff;
            animation: breathe 2.5s infinite; z-index: 10;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 5px rgba(0,123,255,0.4); }
            50% { transform: scale(1.04); box-shadow: 0 0 25px rgba(0,123,255,0.5); }
        }

        /* 坐标定义 1-31 */
        .day-1 { grid-area: 1/3; } .day-2 { grid-area: 1/4; } .day-3 { grid-area: 1/5; }
        .day-4 { grid-area: 2/3; } .day-5 { grid-area: 2/4; } .day-6 { grid-area: 2/5; }
        .day-7 { grid-area: 3/1; } .day-8 { grid-area: 3/2; } .day-9 { grid-area: 3/3; } .day-10 { grid-area: 3/4; } .day-11 { grid-area: 3/5; } .day-12 { grid-area: 3/6; } .day-13 { grid-area: 3/7; }
        .day-14 { grid-area: 4/1; } .day-15 { grid-area: 4/2; } .day-16 { grid-area: 4/3; } .day-17 { grid-area: 4/4; } .day-18 { grid-area: 4/5; } .day-19 { grid-area: 4/6; } .day-20 { grid-area: 4/7; }
        .day-21 { grid-area: 5/1; } .day-22 { grid-area: 5/2; } .day-23 { grid-area: 5/3; } .day-24 { grid-area: 5/4; } .day-25 { grid-area: 5/5; } .day-26 { grid-area: 5/6; } .day-27 { grid-area: 5/7; }
        .day-28 { grid-area: 6/3; } .day-29 { grid-area: 6/4; } .day-30 { grid-area: 6/5; } .day-31 { grid-area: 7/4; }

        /* 不用 flex 的 gap（老内核 WebView 不支持，会全部失效变成 0 间距），一律用 margin */
        .legend { display: flex; flex-direction: column; margin-left: 8vw; }
        .legend-item { display: flex; align-items: center; }
        .legend-item + .legend-item { margin-top: 4vh; }
        .l-box { width: 4.5vw; height: 4.5vw; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 8px; font-size: 1.2vw; flex-shrink: 0; }
        .l-text { margin-left: 20px; }
        .l-text b { font-size: 1.6vw; color: #333; display: block; }
        .l-text small { font-size: 1vw; color: #888; }

        /* ===== 超宽屏（宽高比>2:1：LED拼接/带鱼屏/压矮的窗口）：全部按高度定尺寸 ===== */
        @media (min-aspect-ratio: 2/1) {
            .container { padding: 2vh 4vw; }
            .title { font-size: 6vh; }
            #live-clock { font-size: 2.6vh; }
            .days-label { font-size: 2.6vh; margin-right: 24px; }
            .days-box { font-size: 9vh; padding: 6px 34px; }
            .cross-grid { grid-template-columns: repeat(7, calc((74vh - 60px) / 7)); grid-template-rows: repeat(7, calc((74vh - 60px) / 7)); }
            .day-cell { font-size: 3.8vh; }
            .today-active { border-width: 1.3vh; }
            .legend { margin-left: 10vh; }
            .legend-item + .legend-item { margin-top: 6vh; }
            .l-box { width: 8vh; height: 8vh; font-size: 2.2vh; }
            .l-text { margin-left: 24px; }
            .l-text b { font-size: 2.6vh; }
            .l-text small { font-size: 1.8vh; }
            .footer-tip { font-size: 1.6vh; }
        }

        /* ===== 横屏但视口矮（高<=620px：DPR偏大的安卓大屏/半屏窗口）：再收一档 ===== */
        @media (min-width: 761px) and (max-height: 620px) {
            .container { padding: 2vh 4vw; }
            .title { font-size: 5vh; }
            #live-clock { font-size: 2.4vh; }
            .days-label { font-size: 2.4vh; margin-right: 18px; }
            .days-box { font-size: 8vh; padding: 4px 26px; }
            .cross-grid { grid-template-columns: repeat(7, calc((66vh - 60px) / 7)); grid-template-rows: repeat(7, calc((66vh - 60px) / 7)); }
            .day-cell { font-size: 3.4vh; }
            .today-active { border-width: 1.1vh; }
            .legend { margin-left: 6vw; }
            .legend-item + .legend-item { margin-top: 4vh; }
            .l-box { width: 7vh; height: 7vh; font-size: 2vh; }
            .l-text { margin-left: 18px; }
            .l-text b { font-size: 2.2vh; }
            .l-text small { font-size: 1.6vh; }
            .footer-tip { font-size: 1.4vh; }
        }

        /* ===== 竖屏中大屏（宽>=761px 且竖向：竖装会议屏/平板）：上下堆叠 ===== */
        @media (min-width: 761px) and (orientation: portrait) {
            body { height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; display: block; }
            .container { height: auto; min-height: 100vh; padding: 2.5% 5%; justify-content: flex-start; }
            .main-content { flex-direction: column; padding: 1vh 0; }
            .cross-grid { grid-template-columns: repeat(7, 11vw); grid-template-rows: repeat(7, 11vw); grid-gap: 1vw; gap: 1vw; margin: 0 auto; }
            .day-cell { font-size: 4.8vw; }
            .today-active { border-width: 0.9vw; }
            .legend { margin-left: 0; margin-top: 3vh; width: 100%; padding: 0 4%; }
            .legend-item + .legend-item { margin-top: 2.5vh; }
            .l-box { width: 5vw; height: 5vw; font-size: 1.6vw; }
            .l-text { margin-left: 2vw; }
            .l-text b { font-size: 2.2vw; }
            .l-text small { font-size: 1.5vw; }
            .footer-tip { font-size: 1.6vw; padding: 2vh 0; }
        }

        /* ===== 手机竖屏 / 窄屏（<=760px）：上下堆叠，可滚动兜底 ===== */
        @media (max-width: 760px) {
            body { height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; display: block; }
            .container { height: auto; min-height: 100vh; padding: 16px 16px 10px; justify-content: flex-start; }
            .header { flex-direction: column; align-items: flex-start; }
            .title { font-size: 26px; }
            #live-clock { font-size: 15px; }
            .header-sub { margin-top: 4px; justify-content: flex-start; }
            .days-label { font-size: 15px; font-weight: bold; color: #888; margin-right: 12px; }
            .days-box { font-size: 32px; padding: 4px 22px; border-radius: 8px; }
            .main-content { flex-direction: column; padding: 6px 0; }
            .cross-grid { grid-template-columns: repeat(7, 11vw); grid-template-rows: repeat(7, 11vw); grid-gap: 5px; gap: 5px; margin: 0 auto; }
            .day-cell { font-size: 5vw; border-width: 1.5px; }
            .today-active { border-width: 3px; }
            .legend { margin-left: 0; margin-top: 18px; width: 100%; }
            .legend-item + .legend-item { margin-top: 12px; }
            .l-box { width: 32px; height: 32px; font-size: 12px; border-radius: 6px; flex-shrink: 0; }
            .l-text { margin-left: 12px; }
            .l-text b { font-size: 14px; }
            .l-text small { font-size: 11px; }
            .footer-tip { font-size: 10px; padding: 8px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">EHS 安全十字</div>
            <div class="header-right">
                <div id="live-clock"></div>
                <div class="header-sub">
                    <span class="days-label">无事故天数</span>
                    <span class="days-box">{{ days }}</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="cross-grid">
                {% for d in calendar_days %}
                <div class="day-cell day-{{ d.day }} {{ d.color }}">{{ d.day }}</div>
                {% endfor %}
            </div>

            <div class="legend">
                <div class="legend-item"><div class="l-box green">O</div><div class="l-text"><b>无事故</b><small>可选：分享所吸取的教训</small></div></div>
                <div class="legend-item"><div class="l-box yellow">!</div><div class="l-text"><b>观察/未遂事故</b><small>EHS分类：观察/未遂事故</small></div></div>
                <div class="legend-item"><div class="l-box red">X</div><div class="l-text"><b>急救处理事故/治疗/ LTI（失时工伤）</b><small>EHS分类：轻微/中等/重大</small></div></div>
            </div>
        </div>
        <p class="footer-tip" style="text-align: center; color: #ccc;">全屏展示请在浏览器中按下 F11 键</p>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${year}年${month}月${day}日 ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
